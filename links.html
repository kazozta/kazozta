<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KAZOZTA | روابطنا</title>

  <style>
    @font-face {
      font-family: "Cairo";
      src: url("assets/fonts/cairo-arabic.woff2") format("woff2");
      font-weight: 400 700;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Cairo", Arial, sans-serif;
      background: #f3eee3;
      color: #173d2a;
      display: flex;
      justify-content: center;
      padding: 28px 18px 35px;
    }

    .page {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .brand {
      margin-bottom: 24px;
    }

    .logo {
      display: block;
      width: 185px;
      max-width: 65%;
      height: auto;
      margin: 0 auto 12px;
    }

    .tagline {
      color: #66715f;
      font-size: 14px;
      font-weight: 600;
      margin: 0;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 26px;
    }

    .link {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      padding: 13px 20px;
      border-radius: 15px;

      background: #fffdf8;
      color: #173d2a;
      text-decoration: none;

      font-size: 16px;
      font-weight: 700;

      border: 1px solid rgba(23, 61, 42, 0.08);
      box-shadow: 0 5px 18px rgba(23, 61, 42, 0.07);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(23, 61, 42, 0.12);
    }

    .icon {
      width: 25px;
      height: 25px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      direction: ltr;
    }

    .website {
      background: #173d2a;
      color: #ffffff;
    }

    .footer {
      margin-top: 28px;
      color: #7b8173;
      font-size: 11px;
      font-weight: 600;
    }

    @media (max-width: 380px) {
      body {
        padding: 22px 14px 28px;
      }

      .logo {
        width: 160px;
      }

      .link {
        min-height: 54px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="brand">

      <!-- اللوجو الرسمي لكازوزتا -->
      <img
        class="logo"
        src="assets/logo.png"
        alt="KAZOZTA"
      >

      <p class="tagline">
        الطبيعة على مائدتك
      </p>

    </section>


    <section class="links">

      <!-- الموقع -->
      <a
        class="link website"
        href="https://kazozta.pages.dev/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">🌿</span>
        <span>الموقع الرسمي</span>
      </a>


      <!-- Facebook -->
      <a
        class="link"
        href="https://www.facebook.com/share/1LovqNEZ1m/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">f</span>
        <span>Facebook</span>
      </a>


      <!-- Instagram -->
      <a
        class="link"
        href="https://www.instagram.com/kazozta?stkn=Yng0cHE3aGF1dTE4"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">◎</span>
        <span>Instagram</span>
      </a>


      <!-- TikTok -->
      <a
        class="link"
        href="https://www.tiktok.com/@kazozta?_r=1&_t=ZS-99jTFdvU14K"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">♪</span>
        <span>TikTok</span>
      </a>


      <!-- YouTube -->
      <a
        class="link"
        href="https://youtube.com/@kazozta?si=d9HeThkAIO0BnZ-_"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">▶</span>
        <span>YouTube</span>
      </a>


      <!-- WhatsApp -->
      <a
        class="link"
        href="https://wa.me/201501546667"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">💬</span>
        <span>WhatsApp</span>
      </a>

    </section>


    <footer class="footer">
      KAZOZTA — PREMIUM QUALITY
    </footer>

  </main>

</body>
</html>

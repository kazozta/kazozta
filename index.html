<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAZOZTA</title>
<meta name="description" content="KAZOZTA — premium natural food products.">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header">
  <img src="assets/logo.png" alt="KAZOZTA logo" class="site-header__logo">
  <h1 class="site-header__title">KAZOZTA</h1>
</header>

<main>
  <section id="products" aria-labelledby="products-heading">
    <h2 id="products-heading">Products</h2>
    <div id="product-list" class="product-list"></div>
  </section>

  <section id="cart" aria-labelledby="cart-heading">
    <h2 id="cart-heading">Cart (<span id="cart-count">0</span>)</h2>
    <ul id="cart-items" class="cart-items" aria-live="polite"></ul>
    <p class="cart-total">Total: <span id="cart-total">0</span></p>
  </section>

  <section id="order" aria-labelledby="order-heading">
    <h2 id="order-heading">Checkout</h2>
    <form id="order-form" novalidate>
      <div class="form-field">
        <label for="customer-name">Full name</label>
        <input type="text" id="customer-name" name="customer-name" required autocomplete="name">
      </div>
      <div class="form-field">
        <label for="customer-phone">Phone number</label>
        <input type="tel" id="customer-phone" name="customer-phone" required autocomplete="tel">
      </div>
      <div class="form-field">
        <label for="customer-address">Address</label>
        <textarea id="customer-address" name="customer-address" required autocomplete="street-address"></textarea>
      </div>
      <button type="submit" class="order-form__submit">Send Order via WhatsApp</button>
    </form>
  </section>
</main>

<footer class="site-footer">
  <a href="https://www.facebook.com/share/1LovqNEZ1m/" target="_blank" rel="noopener">Facebook</a>
  <a href="https://www.instagram.com/kazozta?stkn=Yng0cHE3aGF1dTE4" target="_blank" rel="noopener">Instagram</a>
  <a href="https://www.tiktok.com/@kazozta?_r=1&_t=ZS-99jTFdvU14K" target="_blank" rel="noopener">TikTok</a>
  <a href="https://wa.me/message/ITOAAX2ZC6T5L1" target="_blank" rel="noopener">WhatsApp</a>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
